# Full local stack: PostgreSQL, Redis, the Django app and the Celery workers.
# The ML dependencies (dlib, face_recognition) are compiled during the image
# build, so the first build takes a while.

x-app: &app
  build: .
  env_file: .env
  environment: &app-env
    POSTGRES_DB: ${POSTGRES_DB:-camera_analytics}
    POSTGRES_USER: ${POSTGRES_USER:-postgres}
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    POSTGRES_HOST: db
    CELERY_BROKER_REDIS_URL: redis://redis:6379
    CELERY_RESULT_BACKEND: redis://redis:6379
  volumes:
    # uploaded photos are read back by the recognition tasks
    - media:/app/media
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-camera_analytics}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    <<: *app
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             gunicorn backend.wsgi:application --bind 0.0.0.0:8000 --workers 3"
    ports:
      - "8000:8000"

  worker:
    <<: *app
    command: celery -A backend worker -l info

  beat:
    <<: *app
    command: celery -A backend beat -l info

volumes:
  pgdata:
  media:
